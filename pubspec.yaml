name: grand_egyptian_museum
description: Grand Egyptian Museum Ticket Booking — Mobile & Web App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_slider_drawer: ^2.1.0

  image_picker: ^1.0.7

  flutter_bloc: ^8.1.6

  fl_chart: ^0.68.0



  dio: ^5.4.0

  qr_flutter: ^4.1.0

  barcode_widget: ^2.0.4

  arc_sidebar: ^0.0.4

  # URL
  url_launcher: ^6.3.0

  curved_navigation_bar: ^1.0.6

  water_drop_nav_bar: ^2.2.2

  # Networking
  http: ^1.1.0

  # Image caching
  cached_network_image: ^3.3.1

  # Local storage (token persistence)
  shared_preferences: ^2.2.2

  # Formatting dates
  intl: ^0.19.0

  # State management (lightweight)
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # ── Assets ─────────────────────────────────────────────────
  # Run: bash assets/download_assets.sh  to download images from Figma
  assets:
    - assets/images/

